<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in</title>
<link rel="icon" type="image/svg+xml" href="{{ asset('favicon.svg') }}">
<link rel="icon" type="image/png" sizes="32x32" href="{{ asset('favicon.png') }}">
<link rel="apple-touch-icon" href="{{ asset('apple-touch-icon.png') }}">
<meta name="theme-color" content="#2f5d50">
<link rel="stylesheet" href="{{ asset('app.css') }}">
</head>
<body>
<main>
  <h1>Sign in</h1>
  <p class="muted">Enter your access token once on this device. It stays signed in for a year, and your phone or password manager can remember it.</p>
  {% if error %}<div class="banner bad">{{ error }}</div>{% endif %}
  <form method="post" action="/app/login" class="card">
    <input type="text" name="username" value="clothing-advisor" autocomplete="username" hidden>
    <input type="password" name="token" autocomplete="current-password" placeholder="Access token" required autofocus>
    <input type="hidden" name="next" value="{{ next }}">
    <button class="primary" style="margin-top: 12px">Sign in</button>
  </form>
</main>
</body>
</html>
