[project]
name = "clothing-advisor"
version = "0.1.0"
description = "AI clothing advisor with a Home Assistant integration"
requires-python = ">=3.12"
dependencies = [
    "anthropic",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "pillow>=11",
    "tzdata",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
